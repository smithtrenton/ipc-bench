[package]
name = "harness"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
padded-layout = []
copy-elision = []
borrowed-response = []
conditional-wake = []
cached-cursors = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
