[package]
name = "support"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
padded-layout = ["harness/padded-layout"]
copy-elision = ["harness/copy-elision"]
borrowed-response = ["harness/borrowed-response"]
conditional-wake = ["harness/conditional-wake"]
cached-cursors = ["harness/cached-cursors"]

[dependencies]
harness = { path = "../../../harness" }
iceoryx2 = "0.9.3"
ntapi = "0.4.3"
raw_sync = "0.1.5"
shared_memory = "0.12.4"
socket2 = { version = "0.6.5", features = ["all"] }
winapi = { version = "0.3.9", features = ["ntdef", "winnt"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Mailslots",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
